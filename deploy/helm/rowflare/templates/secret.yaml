{{- if not .Values.rowflare.existingSecret }}
{{- $name := include "rowflare.fullname" . }}
{{- $key := .Values.rowflare.secretKey }}
{{- if not $key }}
{{- /* Keep the key generated on install; a new one would make saved credentials unreadable. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "SECRET_KEY") }}
{{- $key = index $existing.data "SECRET_KEY" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rowflare.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ $key | b64enc | quote }}
{{- end }}
