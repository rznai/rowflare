apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rowflare.fullname" . }}-test-connection"
  labels:
    {{- include "rowflare.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command: ["wget", "-q", "-O-", "http://{{ include "rowflare.fullname" . }}:{{ .Values.service.port }}/api/config"]
