# Default values for the Rowflare chart.

image:
  repository: docker.io/rowflare/rowflare
  # Defaults to the chart appVersion.
  tag: ""
  # Pin the image by digest. When set, it is used instead of the tag lookup.
  digest: "sha256:9767136d308a6abe5a59ceb443729168c375cdad48f4c2db4bddaad0f192a1fc"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

rowflare:
  # Public URL of the instance (for example https://rowflare.example.com), used to build absolute links
  # such as invites. Leave empty to derive links from the request.
  appUrl: ""
  # "selfhost": the first account becomes the owner and everyone else joins by invite.
  mode: selfhost
  # Let anyone who can reach the instance create an account.
  allowSignup: false
  # Encrypts the AI service keys, Resend API keys and SMTP passwords that workspace owners save.
  # Leave empty to generate a random key once; it is kept across upgrades.
  # Changing it later makes saved credentials unreadable.
  secretKey: ""
  # Use an existing Secret instead. It must contain the key named by existingSecretKey.
  existingSecret: ""
  existingSecretKey: SECRET_KEY
  logLevel: info

# Extra environment variables, for example MAIL_PROVIDER and SMTP_* (see docs/self-hosting.md).
extraEnv: []
#  - name: MAIL_PROVIDER
#    value: smtp

# Extra environment from Secrets or ConfigMaps, for example SMTP_PASSWORD.
extraEnvFrom: []

persistence:
  enabled: true
  # Use an existing PersistentVolumeClaim for /data.
  existingClaim: ""
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  annotations: {}

service:
  type: ClusterIP
  port: 8787
  annotations: {}

ingress:
  enabled: false
  className: ""
  # Real-time collaboration uses WebSockets on /api/bases/*/ws; ingress-nginx forwards them by default.
  # Raise the proxy timeouts so idle sockets are not cut after 60 seconds.
  annotations: {}
  #  nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  #  nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  #  cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: rowflare.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: rowflare-tls
  #    hosts:
  #      - rowflare.example.com

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podAnnotations: {}
podLabels: {}

# The image runs as the "node" user (uid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

startupProbe:
  httpGet:
    path: /api/config
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /api/config
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/config
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
